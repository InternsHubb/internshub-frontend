<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgTeam)" rx="16" />

  <!-- Collaborative Team Board -->
  <g transform="translate(35, 30)">
    <rect width="330" height="180" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
    
    <!-- Sprint columns -->
    <rect x="20" y="20" width="85" height="140" rx="8" fill="#ffffff" fill-opacity="0.08" />
    <rect x="120" y="20" width="85" height="140" rx="8" fill="#ffffff" fill-opacity="0.08" />
    <rect x="220" y="20" width="85" height="140" rx="8" fill="#ffffff" fill-opacity="0.08" />

    <!-- Column headers -->
    <rect x="30" y="30" width="45" height="6" rx="3" fill="#38bdf8" />
    <rect x="130" y="30" width="45" height="6" rx="3" fill="#fbbf24" />
    <rect x="230" y="30" width="45" height="6" rx="3" fill="#4ade80" />

    <!-- Kanban cards -->
    <rect x="30" y="48" width="65" height="35" rx="6" fill="#ffffff" fill-opacity="0.15" />
    <rect x="30" y="92" width="65" height="28" rx="6" fill="#ffffff" fill-opacity="0.15" />

    <rect x="130" y="48" width="65" height="42" rx="6" fill="#ffffff" fill-opacity="0.15" />
    <rect x="130" y="98" width="65" height="32" rx="6" fill="#ffffff" fill-opacity="0.15" />

    <rect x="230" y="48" width="65" height="48" rx="6" fill="#ffffff" fill-opacity="0.15" />
  </g>

  <!-- Floating badge -->
  <rect x="225" y="170" width="135" height="34" rx="17" fill="#ec4899" />
  <text x="292" y="192" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Agile &amp; Team</text>
</svg>
