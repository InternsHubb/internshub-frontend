<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a154b" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgGrad1)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.15">
    <path d="M0 40 H400 M0 80 H400 M0 120 H400 M0 160 H400 M0 200 H400" stroke="#fff" stroke-width="1" />
    <path d="M50 0 V240 M100 0 V240 M150 0 V240 M200 0 V240 M250 0 V240 M300 0 V240 M350 0 V240" stroke="#fff" stroke-width="1" />
  </g>

  <!-- Big UI Tag -->
  <rect x="24" y="24" width="70" height="28" rx="14" fill="#ffffff" fill-opacity="0.3" />
  <text x="59" y="43" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">UI / UX</text>

  <!-- Central 3D Glass Cards -->
  <g transform="translate(110, 50)">
    <!-- Back card -->
    <rect x="50" y="10" width="140" height="150" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Front card -->
    <rect x="10" y="25" width="150" height="150" rx="14" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <!-- Content inside front card -->
    <rect x="25" y="45" width="60" height="14" rx="4" fill="#f43f5e" />
    <rect x="25" y="70" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.8" />
    <rect x="25" y="86" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.5" />
    <rect x="25" y="102" width="105" height="8" rx="4" fill="#ffffff" fill-opacity="0.5" />
    <circle cx="130" cy="145" r="16" fill="#a855f7" />
    <path d="M125 145 L129 149 L136 141" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Floating badges -->
  <circle cx="80" cy="170" r="28" fill="#f472b6" fill-opacity="0.35" />
  <text x="80" y="177" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="middle">UX</text>
  
  <rect x="270" y="150" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.3" />
  <text x="320" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Design Systems</text>
</svg>
